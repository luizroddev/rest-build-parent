name: CI Build

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version to use (17 or 22)'
        required: false
        type: string
        default: '22'
      java-distribution:
        description: 'Java distribution (temurin, graalvm, etc.)'
        required: false
        type: string
        default: 'temurin'
      maven-args:
        description: 'Extra Maven arguments'
        required: false
        type: string
        default: ''
      timeout-minutes:
        description: 'Hard stop for the build job, in minutes'
        required: false
        type: number
        default: 20
    secrets:
      PACKAGES_TOKEN:
        description: 'GitHub PAT with read:packages scope for resolving internal dependencies'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java ${{ inputs.java-version }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}
          cache: maven
          overwrite-settings: false

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <activeProfiles>
              <activeProfile>restship</activeProfile>
            </activeProfiles>
            <profiles>
              <profile>
                <id>restship</id>
                <repositories>
                  <repository>
                    <id>central</id>
                    <url>https://repo1.maven.org/maven2</url>
                  </repository>
                  <repository>
                    <id>restship</id>
                    <url>https://maven.pkg.github.com/romulofebasi/restship</url>
                    <snapshots>
                      <enabled>true</enabled>
                      <updatePolicy>always</updatePolicy>
                    </snapshots>
                  </repository>
                  <repository>
                    <id>restship-build</id>
                    <url>https://maven.pkg.github.com/luizroddev/rest-build-parent</url>
                    <snapshots>
                      <enabled>true</enabled>
                      <updatePolicy>always</updatePolicy>
                    </snapshots>
                  </repository>
                  <repository>
                    <id>restship-pvpgame</id>
                    <url>https://maven.pkg.github.com/luizroddev/rest-module-pvpgame</url>
                    <snapshots>
                      <enabled>true</enabled>
                      <updatePolicy>always</updatePolicy>
                    </snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <servers>
              <server>
                <id>restship</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.PACKAGES_TOKEN }}</password>
              </server>
              <server>
                <id>restship-build</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.PACKAGES_TOKEN }}</password>
              </server>
              <server>
                <id>restship-pvpgame</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.PACKAGES_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF

      # One invocation: the second `mvn test` recompiled every source from scratch (40 s of 242 s
      # in minecore) and paid dependency resolution twice. `package` runs the same tests, stops
      # at the first failure the same way, and still proves the shaded jar assembles. The source
      # jar is only needed for publishing, never for verification.
      - name: Build and test with Maven
        run: mvn -B -U clean package -Dmaven.source.skip=true ${{ inputs.maven-args }}
